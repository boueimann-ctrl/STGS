<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BFT - UAV Tactical Tracker</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #050b14;
      font-family: 'Courier New', Courier, monospace;
      color: #00ffcc;
    }
    #map {
      height: 100vh; width: 100vw;
      background-color: #050b14;
    }

    /* 起動時 バイブレーション確認＆エントリー用オーバーレイ */
    .init-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 11, 20, 0.95);
      z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 24px; text-align: center;
    }
    .init-card {
      border: 1px solid #00ffcc;
      background: rgba(5, 11, 20, 0.9);
      padding: 24px; border-radius: 6px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      max-width: 320px; width: 100%;
    }
    .init-title {
      font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #ffffff;
      letter-spacing: 1px;
    }
    .init-desc {
      font-size: 11px; line-height: 1.5; color: #88ffdd; margin-bottom: 20px;
    }
    .init-btn {
      width: 100%; padding: 12px; margin-bottom: 10px;
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid #00ffcc; color: #00ffcc;
      font-family: inherit; font-weight: bold; font-size: 12px;
      border-radius: 4px; cursor: pointer;
    }
    .init-btn-primary {
      background: #00ffcc; color: #050b14;
    }
    .init-btn-primary:disabled {
      background: #335544; color: #888888; border-color: #446655;
      cursor: not-allowed;
    }

    /* 軍用HUD風ディスプレイ */
    .hud-overlay {
      position: absolute;
      top: 12px; left: 12px; z-index: 1000;
      background: rgba(5, 11, 20, 0.85);
      border: 1px solid #00ffcc;
      border-radius: 4px;
      padding: 10px 14px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.25);
      pointer-events: auto;
    }
    .hud-title {
      font-size: 10px; font-weight: bold; letter-spacing: 1px;
      color: #88ffdd; text-transform: uppercase; margin-bottom: 4px;
    }
    .hud-timer {
      font-size: 16px; font-weight: bold; color: #ffffff;
    }
    .hud-status {
      font-size: 11px; color: #00ffcc; margin-top: 4px;
    }

    /* 部隊（スクワッド）選択UI & コントロール */
    .squad-selector {
      margin-top: 8px;
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .squad-btn {
      background: rgba(5, 11, 20, 0.8);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-size: 11px; font-weight: bold;
      padding: 5px 8px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .squad-btn.active {
      background: #ffaa00;
      color: #050b14;
      border-color: #ffaa00;
    }

    /* 右下：作戦描画用コントロールUI */
    .draw-controls {
      position: absolute;
      bottom: 20px; right: 12px; z-index: 1000;
      display: flex; gap: 8px;
      pointer-events: auto;
    }
    .hud-btn {
      background: rgba(5, 11, 20, 0.9);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 12px; font-weight: bold;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
      cursor: pointer;
    }
    .hud-btn.active {
      background: #00ffcc;
      color: #050b14;
    }

    /* マーカーデザイン */
    .player-marker-me {
      width: 10px; height: 10px;
      background-color: #00ffcc; border: 1.5px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 8px #00ffcc;
      transition: all 0.2s ease;
    }
    .player-marker-team {
      width: 8px; height: 8px;
      background-color: #0099ff; border: 1.5px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 6px #0099ff;
      transition: all 0.2s ease;
    }

    /* Leaflet Tooltip & Popup カスタマイズ */
    .leaflet-tooltip-custom {
      background: rgba(5, 11, 20, 0.9) !important;
      border: 1px solid #00ffcc !important;
      color: #00ffcc !important;
      font-family: 'Courier New', Courier, monospace !important;
      font-size: 11px !important;
      font-weight: bold !important;
      border-radius: 3px !important;
      padding: 3px 6px !important;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.4) !important;
    }
    .leaflet-tooltip-custom::before {
      display: none !important;
    }
  </style>
</head>
<body>

<!-- 初期接続・バイブレーションテスト画面 -->
<div class="init-modal-overlay" id="initModal">
  <div class="init-card">
    <div class="init-title">TACTICAL SYSTEM INIT</div>
    <div class="init-desc">
      作戦開始前の端末チェックを行います。<br>
      バイブレーションテストを実施して動作を確認してください。
    </div>
    <button class="init-btn" id="testVibeBtn">TEST VIBRATION ⚡</button>
    <button class="init-btn init-btn-primary" id="joinOpBtn" disabled>JOIN OPERATION (START GPS)</button>
  </div>
</div>

<div class="hud-overlay">
  <div class="hud-title" id="hudTitle">UAV RECON // SQUAD-ALPHA</div>
  <div class="hud-timer" id="uavTimer">NEXT SCAN: PAUSED</div>
  <div class="hud-status" id="statusText">AWAITING OPERATION START</div>
  
  <!-- コンパクト部隊切り替え & タイマーコントロールUI -->
  <div class="squad-selector">
    <button class="squad-btn" id="squadToggleBtn" style="border-color: #ff0055; color: #ff0055;">SQUAD: ALPHA ↺</button>
    <button class="squad-btn" id="addSquadBtn" style="border-color: #888; color: #fff;">+</button>
    <button class="squad-btn" id="hqBtn" style="border-color: #ffaa00; color: #ffaa00;">ALL (HQ)</button>
    <button class="squad-btn" id="setNameBtn" style="border-color: #ffffff; color: #ffffff;">NAME</button>
    <button class="squad-btn" id="startTimerBtn" style="border-color: #00ffcc; color: #00ffcc; background: rgba(0,255,204,0.15);">START TAC-TIMER</button>
  </div>
</div>

<div class="draw-controls" id="drawControls">
  <button id="toggleDrawBtn" class="hud-btn">DRAW: OFF</button>
  <button id="clearDrawBtn" class="hud-btn">CLEAR SQUAD LINES</button>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getDatabase, ref, set, push, get, onValue, remove, onDisconnect 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXskTRVUm4CL9rPQj110sw59M20OyJi28",
    authDomain: "spac-gps.firebaseapp.com",
    databaseURL: "https://spac-gps-default-rtdb.firebaseio.com",
    projectId: "spac-gps",
    storageBucket: "spac-gps.firebasestorage.app",
    messagingSenderId: "184349883329",
    appId: "1:184349883329:web:7e1d0bc6b40fa58e2dcd40",
    measurementId: "G-SWCQYHGHYX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const operationId = "operation_alpha";
  let isVibrationTested = false;
  let isOpJoined = false;

  // 1. 初期テスト＆参戦処理
  const initModal = document.getElementById('initModal');
  const testVibeBtn = document.getElementById('testVibeBtn');
  const joinOpBtn = document.getElementById('joinOpBtn');

  testVibeBtn.addEventListener('click', () => {
    if ("vibrate" in navigator) {
      navigator.vibrate([150, 100, 150]);
    } else {
      alert("この端末/ブラウザはバイブレーション機能をサポートしていません。");
    }
    isVibrationTested = true;
    joinOpBtn.disabled = false;
    testVibeBtn.innerText = "TEST OK (RE-TEST) ⚡";
  });

  joinOpBtn.addEventListener('click', () => {
    if (!isVibrationTested) return;
    isOpJoined = true;
    initModal.style.display = 'none';
    initGPS();
  });

  // 2. ユーザー名設定
  let savedName = localStorage.getItem("bft_callsign");
  if (!savedName) {
    savedName = "OPERATOR_" + Math.floor(100 + Math.random() * 900);
    localStorage.setItem("bft_callsign", savedName);
  }
  let userId = savedName;

  const setNameBtn = document.getElementById('setNameBtn');
  setNameBtn.addEventListener('click', () => {
    const inputName = prompt("コールサイン（名前）を入力してください:", userId);
    if (inputName && inputName.trim() !== "") {
      userId = inputName.trim();
      localStorage.setItem("bft_callsign", userId);
      alert(`コールサインを [ ${userId} ] に変更しました。`);
      executeUAVScan();
    }
  });

  // 3. 部隊管理（動的追加対応 & カラーテーブル）
  let squadList = ["ALPHA", "BRAVO", "CHARLIE"];
  const PRESET_COLORS = ["#ff0055", "#00e5ff", "#76ff03", "#ff9100", "#d500f9", "#ffff00", "#00e676"];
  const SQUAD_COLORS = {
    "ALPHA": "#ff0055",
    "BRAVO": "#00e5ff",
    "CHARLIE": "#76ff03"
  };

  let currentSquadIndex = 0;
  let currentSquad = squadList[currentSquadIndex];
  let isHQMode = false;

  // 地図の初期化
  const map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
    maxZoom: 21
  });

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: 19,
    maxZoom: 21
  }).addTo(map);

  const playerMarkers = {};
  let currentLat = null;
  let currentLng = null;
  let isMapInitialized = false;

  // 4. 部隊トグル & HQモード切り替え制御
  const squadToggleBtn = document.getElementById('squadToggleBtn');
  const addSquadBtn = document.getElementById('addSquadBtn');
  const hqBtn = document.getElementById('hqBtn');
  const hudTitle = document.getElementById('hudTitle');
  const drawControls = document.getElementById('drawControls');

  function updateSquadUI() {
    if (isHQMode) {
      hudTitle.innerText = `UAV RECON // COMMAND (ALL HQ)`;
      drawControls.style.display = 'none';
      hqBtn.classList.add('active');
      squadToggleBtn.style.opacity = '0.6';
      if (isDrawingMode) disableDrawingMode();
    } else {
      currentSquad = squadList[currentSquadIndex];
      const color = SQUAD_COLORS[currentSquad] || '#00ffcc';

      hudTitle.innerText = `UAV RECON // SQUAD-${currentSquad}`;
      squadToggleBtn.innerText = `SQUAD: ${currentSquad} ↺`;
      squadToggleBtn.style.borderColor = color;
      squadToggleBtn.style.color = color;
      squadToggleBtn.style.opacity = '1.0';

      drawControls.style.display = 'flex';
      hqBtn.classList.remove('active');
    }
    syncDrawings();
  }

  squadToggleBtn.addEventListener('click', () => {
    isHQMode = false;
    currentSquadIndex = (currentSquadIndex + 1) % squadList.length;
    updateSquadUI();
    executeUAVScan();
  });

  addSquadBtn.addEventListener('click', () => {
    const newSquad = prompt("新しい部隊名を入力してください (例: DELTA):");
    if (newSquad && newSquad.trim() !== "") {
      const formattedSquad = newSquad.trim().toUpperCase();
      if (!squadList.includes(formattedSquad)) {
        squadList.push(formattedSquad);
        const color = PRESET_COLORS[(squadList.length - 1) % PRESET_COLORS.length];
        SQUAD_COLORS[formattedSquad] = color;
        
        currentSquadIndex = squadList.length - 1;
        isHQMode = false;
        updateSquadUI();
        executeUAVScan();
      } else {
        alert("その部隊名は既に存在します。");
      }
    }
  });

  hqBtn.addEventListener('click', () => {
    isHQMode = !isHQMode;
    updateSquadUI();
    executeUAVScan();
  });

  // 5. 地図連動 ＆ 部隊別リアルタイム描画処理
  const toggleDrawBtn = document.getElementById('toggleDrawBtn');
  const clearDrawBtn = document.getElementById('clearDrawBtn');

  let isDrawingMode = false;
  let isPenDown = false;
  let currentPolyline = null;
  let currentPoints = [];
  let mapLines = {};

  function disableDrawingMode() {
    isDrawingMode = false;
    toggleDrawBtn.classList.remove('active');
    toggleDrawBtn.innerText = "DRAW: OFF";
    map.dragging.enable();
    map.touchZoom.enable();
    map.doubleClickZoom.enable();
  }

  toggleDrawBtn.addEventListener('click', () => {
    if (isHQMode) return;

    isDrawingMode = !isDrawingMode;
    if (isDrawingMode) {
      toggleDrawBtn.classList.add('active');
      toggleDrawBtn.innerText = "DRAW: ON";
      map.dragging.disable();
      map.touchZoom.disable();
      map.doubleClickZoom.disable();
    } else {
      disableDrawingMode();
    }
  });

  clearDrawBtn.addEventListener('click', async () => {
    if (isHQMode) return;

    const drawnLinesRef = ref(db, `ops/${operationId}/drawings`);
    const snapshot = await get(drawnLinesRef);
    if (snapshot.exists()) {
      const drawings = snapshot.val();
      Object.keys(drawings).forEach((lineId) => {
        if (drawings[lineId].squad === currentSquad) {
          remove(ref(db, `ops/${operationId}/drawings/${lineId}`));
        }
      });
    }
  });

  const mapContainer = map.getContainer();

  function startLine(e) {
    if (!isDrawingMode || isHQMode) return;
    isPenDown = true;
    
    const containerPoint = getContainerPoint(e);
    const latLng = map.containerPointToLatLng(containerPoint);
    currentPoints = [[latLng.lat, latLng.lng]];

    currentPolyline = L.polyline(currentPoints, {
      color: SQUAD_COLORS[currentSquad] || '#ff0055',
      weight: 4,
      opacity: 0.9
    }).addTo(map);
  }

  function drawLine(e) {
    if (!isPenDown || !isDrawingMode || isHQMode) return;
    if (e.cancelable) e.preventDefault();

    const containerPoint = getContainerPoint(e);
    const latLng = map.containerPointToLatLng(containerPoint);
    currentPoints.push([latLng.lat, latLng.lng]);
    currentPolyline.setLatLngs(currentPoints);
  }

  function stopLine() {
    if (!isPenDown || !isDrawingMode || isHQMode) return;
    isPenDown = false;

    if (currentPoints.length > 1) {
      const drawnLinesRef = ref(db, `ops/${operationId}/drawings`);
      const newLineRef = push(drawnLinesRef);
      set(newLineRef, {
        authorId: userId,
        squad: currentSquad,
        points: currentPoints,
        createdAt: Date.now()
      });
    }

    if (currentPolyline) {
      map.removeLayer(currentPolyline);
      currentPolyline = null;
    }
    currentPoints = [];
  }

  function getContainerPoint(e) {
    const rect = mapContainer.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return L.point(touch.clientX - rect.left, touch.clientY - rect.top);
  }

  mapContainer.addEventListener('touchstart', startLine, { passive: false });
  mapContainer.addEventListener('touchmove', drawLine, { passive: false });
  mapContainer.addEventListener('touchend', stopLine);
  mapContainer.addEventListener('mousedown', startLine);
  mapContainer.addEventListener('mousemove', drawLine);
  mapContainer.addEventListener('mouseup', stopLine);

  // 6. Firebaseからのリアルタイム作戦線データ同期
  let drawingsUnsubscribe = null;

  function syncDrawings() {
    Object.keys(mapLines).forEach(id => map.removeLayer(mapLines[id]));
    mapLines = {};

    const drawnLinesRef = ref(db, `ops/${operationId}/drawings`);

    if (drawingsUnsubscribe) drawingsUnsubscribe();

    drawingsUnsubscribe = onValue(drawnLinesRef, (snapshot) => {
      const drawings = snapshot.val() || {};

      Object.keys(mapLines).forEach((lineId) => {
        if (!drawings[lineId]) {
          map.removeLayer(mapLines[lineId]);
          delete mapLines[lineId];
        }
      });

      Object.keys(drawings).forEach((lineId) => {
        const lineData = drawings[lineId];
        const shouldShow = isHQMode || (lineData.squad === currentSquad);

        if (shouldShow) {
          if (!mapLines[lineId]) {
            const lineColor = SQUAD_COLORS[lineData.squad] || '#ffffff';
            const polyline = L.polyline(lineData.points, {
              color: lineColor,
              weight: 4,
              opacity: 0.9
            }).addTo(map);
            mapLines[lineId] = polyline;
          }
        } else {
          if (mapLines[lineId]) {
            map.removeLayer(mapLines[lineId]);
            delete mapLines[lineId];
          }
        }
      });
    });
  }

  syncDrawings();

  // 7. リーダー統括タイマー ＆ スキャン制御
  const SCAN_INTERVAL_SEC = 60;
  let opStartTime = null;
  let lastScannedCycle = -1;
  let lastVibratedSec = -1;

  const startTimerBtn = document.getElementById('startTimerBtn');
  const timerRef = ref(db, `ops/${operationId}/timer`);

  // 作戦タイマー共有同期を監視
  onValue(timerRef, (snapshot) => {
    const data = snapshot.val();
    if (data && data.startTime) {
      opStartTime = data.startTime;
      lastScannedCycle = -1;
      startTimerBtn.innerText = "RESET TIMER";
      startTimerBtn.style.borderColor = "#ffaa00";
      startTimerBtn.style.color = "#ffaa00";
    } else {
      opStartTime = null;
      document.getElementById("uavTimer").innerText = `NEXT SCAN: PAUSED`;
      document.getElementById("statusText").innerText = "AWAITING TIMER START";
      startTimerBtn.innerText = "START TAC-TIMER";
      startTimerBtn.style.borderColor = "#00ffcc";
      startTimerBtn.style.color = "#00ffcc";
    }
  });

  // リーダーによるタイマー起動/リセット
  startTimerBtn.addEventListener('click', () => {
    if (opStartTime) {
      if (confirm("全プレイヤーの作戦タイマーをリセットしますか？")) {
        set(timerRef, null);
      }
    } else {
      if (confirm("作戦タイマーを起動し、全員のカウントダウンを開始しますか？")) {
        set(timerRef, { startTime: Date.now() });
      }
    }
  });

  function executeUAVScan() {
    if (currentLat && currentLng && isOpJoined) {
      const userRef = ref(db, `ops/${operationId}/players/${userId}`);
      onDisconnect(userRef).remove();

      set(userRef, {
        u: userId,
        squad: isHQMode ? 'hq' : currentSquad,
        lat: currentLat,
        lng: currentLng,
        scannedAt: Date.now()
      });

      if ("vibrate" in navigator) {
        try { navigator.vibrate([120, 80, 120]); } catch (e) {}
      }

      const statusText = document.getElementById("statusText");
      statusText.innerText = "UAV SCAN COMPLETE";
      statusText.style.color = "#ffffff";
      setTimeout(() => {
        statusText.style.color = "#00ffcc";
        statusText.innerText = "STANDBY FOR NEXT RECON";
      }, 2500);
    }
  }

  // タイマーループ (共有開始時刻からの経過時間で計算)
  setInterval(() => {
    if (!opStartTime) return;

    const elapsedSec = Math.floor((Date.now() - opStartTime) / 1000);
    if (elapsedSec < 0) return;

    const currentCycle = Math.floor(elapsedSec / SCAN_INTERVAL_SEC);
    const secondsInCycle = elapsedSec % SCAN_INTERVAL_SEC;
    const remainingSec = SCAN_INTERVAL_SEC - secondsInCycle;

    // 10秒前の事前バイブ通知
    if (remainingSec === 10 && lastVibratedSec !== elapsedSec) {
      if ("vibrate" in navigator) {
        try { navigator.vibrate([200]); } catch (e) {}
      }
      lastVibratedSec = elapsedSec;
    }

    // 新しいスキャン周期（0秒到達）での処理
    if (currentCycle > lastScannedCycle) {
      executeUAVScan();
      lastScannedCycle = currentCycle;
    }

    document.getElementById("uavTimer").innerText = `NEXT SCAN: ${remainingSec}S`;
  }, 200);

  // 8. GPS位置取得
  function initGPS() {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentLat = position.coords.latitude;
          currentLng = position.coords.longitude;

          map.setView([currentLat, currentLng], 20);
          isMapInitialized = true;
          executeUAVScan();
        },
        (err) => {
          console.warn("GPS取得失敗:", err);
          map.setView([35.9868, 139.8515], 18);
          isMapInitialized = true;
        },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
      );

      navigator.geolocation.watchPosition(
        (position) => {
          currentLat = position.coords.latitude;
          currentLng = position.coords.longitude;

          if (!isMapInitialized) {
            map.setView([currentLat, currentLng], 20);
            isMapInitialized = true;
            executeUAVScan();
          }
        },
        (err) => console.error("GPS Error:", err),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 2000 }
      );
    } else {
      alert("GPS非対応の端末です。");
    }
  }

  // 9. 味方位置同期
  const teamPlayersRef = ref(db, `ops/${operationId}/players`);
  onValue(teamPlayersRef, (snapshot) => {
    const players = snapshot.val() || {};

    Object.keys(playerMarkers).forEach((id) => {
      if (!players[id]) {
        map.removeLayer(playerMarkers[id]);
        delete playerMarkers[id];
      }
    });

    Object.values(players).forEach((p) => {
      const isMe = p.u === userId;
      const markerClass = isMe ? 'player-marker-me' : 'player-marker-team';
      const squadTag = (p.squad || '').toUpperCase();
      const labelText = isMe ? `YOU (${p.u})` : `${p.u} [${squadTag}]`;

      if (playerMarkers[p.u]) {
        playerMarkers[p.u].setLatLng([p.lat, p.lng]);
        playerMarkers[p.u].setTooltipContent(labelText);
      } else {
        const customIcon = L.divIcon({
          className: markerClass,
          iconSize: isMe ? [10, 10] : [8, 8],
          iconAnchor: isMe ? [5, 5] : [4, 4]
        });

        const marker = L.marker([p.lat, p.lng], { icon: customIcon })
          .bindTooltip(labelText, { 
            permanent: false, 
            direction: 'top', 
            offset: [0, -6],
            className: 'leaflet-tooltip-custom'
          })
          .addTo(map);

        playerMarkers[p.u] = marker;
      }
    });
  });
</script>

</body>
