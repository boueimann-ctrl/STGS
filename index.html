<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BFT - UAV Tactical Tracker</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #050b14;
      font-family: 'Courier New', Courier, monospace;
      color: #00ffcc;
    }
    #map {
      height: 100vh; width: 100vw;
      background-color: #050b14;
    }

    /* 軍用HUD風ディスプレイ */
    .hud-overlay {
      position: absolute;
      top: 12px; left: 12px; z-index: 1000;
      background: rgba(5, 11, 20, 0.85);
      border: 1px solid #00ffcc;
      border-radius: 4px;
      padding: 10px 14px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.25);
      pointer-events: auto;
    }
    .hud-title {
      font-size: 10px; font-weight: bold; letter-spacing: 1px;
      color: #88ffdd; text-transform: uppercase; margin-bottom: 4px;
    }
    .hud-timer {
      font-size: 16px; font-weight: bold; color: #ffffff;
    }
    .hud-status {
      font-size: 11px; color: #00ffcc; margin-top: 4px;
    }

    /* 右上：全画面表示ボタン */
    .fullscreen-control {
      position: absolute;
      top: 12px; right: 12px; z-index: 1000;
      pointer-events: auto;
    }

    /* 右下：作戦描画用コントロールUI */
    .draw-controls {
      position: absolute;
      bottom: 20px; right: 12px; z-index: 1000;
      display: flex; gap: 8px;
      pointer-events: auto;
    }
    .hud-btn {
      background: rgba(5, 11, 20, 0.9);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 12px; font-weight: bold;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
      cursor: pointer;
    }
    .hud-btn.active {
      background: #00ffcc;
      color: #050b14;
    }

    /* マーカーデザイン（発光ドット） */
    .player-marker-me {
      width: 14px; height: 14px;
      background-color: #00ffcc; border: 2px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 12px #00ffcc;
    }
    .player-marker-team {
      width: 12px; height: 12px;
      background-color: #0099ff; border: 2px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 8px #0099ff;
    }
  </style>
</head>
<body>

<div class="hud-overlay">
  <div class="hud-title">UAV RECON // SQUAD-ALPHA</div>
  <div class="hud-timer" id="uavTimer">NEXT SCAN: 60S</div>
  <div class="hud-status" id="statusText">ACQUIRING GPS...</div>
</div>

<div class="fullscreen-control">
  <button id="fullScreenBtn" class="hud-btn">FULLSCREEN</button>
</div>

<div class="draw-controls">
  <button id="toggleDrawBtn" class="hud-btn">DRAW: OFF</button>
  <button id="clearDrawBtn" class="hud-btn">CLEAR MY LINES</button>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getDatabase, ref, set, push, get, onValue, remove, onDisconnect 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // 1. Firebase 設定
  const firebaseConfig = {
    apiKey: "AIzaSyBXskTRVUm4CL9rPQj110sw59M20OyJi28",
    authDomain: "spac-gps.firebaseapp.com",
    databaseURL: "https://spac-gps-default-rtdb.firebaseio.com",
    projectId: "spac-gps",
    storageBucket: "spac-gps.firebasestorage.app",
    messagingSenderId: "184349883329",
    appId: "1:184349883329:web:7e1d0bc6b40fa58e2dcd40",
    measurementId: "G-SWCQYHGHYX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const userId = "OPERATOR_" + Math.floor(100 + Math.random() * 900);
  const teamId = "alpha_squad";

  // 2. 地図の初期化
  const map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
    maxZoom: 21
  });

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: 19,
    maxZoom: 21
  }).addTo(map);

  const playerMarkers = {};
  let currentLat = null;
  let currentLng = null;
  let isMapInitialized = false;

  // 3. 全画面モード制御
  const fullScreenBtn = document.getElementById('fullScreenBtn');
  fullScreenBtn.addEventListener('click', () => {
    const docElm = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (docElm.requestFullscreen) {
        docElm.requestFullscreen().catch(() => {});
      } else if (docElm.webkitRequestFullscreen) {
        docElm.webkitRequestFullscreen();
      }
      window.scrollTo(0, 1);
      fullScreenBtn.innerText = "EXIT FULL";
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      fullScreenBtn.innerText = "FULLSCREEN";
    }
  });

  // 4. 地図連動 ＆ 自分所有権つきリアルタイム描画処理
  const toggleDrawBtn = document.getElementById('toggleDrawBtn');
  const clearDrawBtn = document.getElementById('clearDrawBtn');
  const drawnLinesRef = ref(db, `teams/${teamId}/drawings`);

  let isDrawingMode = false;
  let isPenDown = false;
  let currentPolyline = null;
  let currentPoints = [];
  const mapLines = {};

  toggleDrawBtn.addEventListener('click', () => {
    isDrawingMode = !isDrawingMode;
    if (isDrawingMode) {
      toggleDrawBtn.classList.add('active');
      toggleDrawBtn.innerText = "DRAW: ON";
      map.dragging.disable();
      map.touchZoom.disable();
      map.doubleClickZoom.disable();
    } else {
      toggleDrawBtn.classList.remove('active');
      toggleDrawBtn.innerText = "DRAW: OFF";
      map.dragging.enable();
      map.touchZoom.enable();
      map.doubleClickZoom.enable();
    }
  });

  // 自分描画分のみクリアする処理
  clearDrawBtn.addEventListener('click', async () => {
    const snapshot = await get(drawnLinesRef);
    if (snapshot.exists()) {
      const drawings = snapshot.val();
      Object.keys(drawings).forEach((lineId) => {
        if (drawings[lineId].authorId === userId) {
          const singleLineRef = ref(db, `teams/${teamId}/drawings/${lineId}`);
          remove(singleLineRef);
        }
      });
    }
  });

  const mapContainer = map.getContainer();

  function startLine(e) {
    if (!isDrawingMode) return;
    isPenDown = true;
    
    const containerPoint = getContainerPoint(e);
    const latLng = map.containerPointToLatLng(containerPoint);
    currentPoints = [[latLng.lat, latLng.lng]];

    currentPolyline = L.polyline(currentPoints, {
      color: '#ff0055',
      weight: 4,
      opacity: 0.9
    }).addTo(map);
  }

  function drawLine(e) {
    if (!isPenDown || !isDrawingMode) return;
    if (e.cancelable) e.preventDefault();

    const containerPoint = getContainerPoint(e);
    const latLng = map.containerPointToLatLng(containerPoint);
    currentPoints.push([latLng.lat, latLng.lng]);
    currentPolyline.setLatLngs(currentPoints);
  }

  function stopLine() {
    if (!isPenDown || !isDrawingMode) return;
    isPenDown = false;

    if (currentPoints.length > 1) {
      const newLineRef = push(drawnLinesRef);
      set(newLineRef, {
        authorId: userId, // 描画者のIDを保持
        points: currentPoints,
        createdAt: Date.now()
      });
    }

    if (currentPolyline) {
      map.removeLayer(currentPolyline);
      currentPolyline = null;
    }
    currentPoints = [];
  }

  function getContainerPoint(e) {
    const rect = mapContainer.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return L.point(touch.clientX - rect.left, touch.clientY - rect.top);
  }

  mapContainer.addEventListener('touchstart', startLine, { passive: false });
  mapContainer.addEventListener('touchmove', drawLine, { passive: false });
  mapContainer.addEventListener('touchend', stopLine);
  mapContainer.addEventListener('mousedown', startLine);
  mapContainer.addEventListener('mousemove', drawLine);
  mapContainer.addEventListener('mouseup', stopLine);

  // 5. Firebaseからリアルタイムに落書きを受信＆描画
  onValue(drawnLinesRef, (snapshot) => {
    const drawings = snapshot.val() || {};

    Object.keys(mapLines).forEach((lineId) => {
      if (!drawings[lineId]) {
        map.removeLayer(mapLines[lineId]);
        delete mapLines[lineId];
      }
    });

    Object.keys(drawings).forEach((lineId) => {
      if (!mapLines[lineId]) {
        const lineData = drawings[lineId];
        const polyline = L.polyline(lineData.points, {
          color: lineData.authorId === userId ? '#ff0055' : '#ffaa00', // 自分の線は赤、味方の線はオレンジで区別
          weight: 4,
          opacity: 0.9
        }).addTo(map);
        mapLines[lineId] = polyline;
      }
    });
  });

  // 6. UAVスキャン処理
  const SCAN_INTERVAL_SEC = 60;
  let countdown = SCAN_INTERVAL_SEC;

  function executeUAVScan() {
    if (currentLat && currentLng) {
      const userRef = ref(db, `teams/${teamId}/players/${userId}`);
      onDisconnect(userRef).remove();

      set(userRef, {
        u: userId,
        lat: currentLat,
        lng: currentLng,
        scannedAt: Date.now()
      });

      if ("vibrate" in navigator) {
        navigator.vibrate([120, 80, 120]);
      }

      const statusText = document.getElementById("statusText");
      statusText.innerText = "UAV SCAN COMPLETE";
      statusText.style.color = "#ffffff";
      setTimeout(() => {
        statusText.style.color = "#00ffcc";
        statusText.innerText = "STANDBY FOR NEXT RECON";
      }, 2500);
    }
  }

  setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      executeUAVScan();
      countdown = SCAN_INTERVAL_SEC;
    }
    document.getElementById("uavTimer").innerText = `NEXT SCAN: ${countdown}S`;
  }, 1000);

  // 7. GPS位置取得
  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        currentLat = position.coords.latitude;
        currentLng = position.coords.longitude;

        map.setView([currentLat, currentLng], 20);
        isMapInitialized = true;
        executeUAVScan();
      },
      (err) => {
        console.warn("GPS取得失敗:", err);
        map.setView([35.9868, 139.8515], 18);
        isMapInitialized = true;
      },
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
    );

    navigator.geolocation.watchPosition(
      (position) => {
        currentLat = position.coords.latitude;
        currentLng = position.coords.longitude;

        if (!isMapInitialized) {
          map.setView([currentLat, currentLng], 20);
          isMapInitialized = true;
          executeUAVScan();
        }
      },
      (err) => console.error("GPS Error:", err),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 2000 }
    );
  } else {
    alert("GPS非対応の端末です。");
  }

  // 8. 味方位置同期
  const teamPlayersRef = ref(db, `teams/${teamId}/players`);
  onValue(teamPlayersRef, (snapshot) => {
    const players = snapshot.val() || {};

    Object.keys(playerMarkers).forEach((id) => {
      if (!players[id]) {
        map.removeLayer(playerMarkers[id]);
        delete playerMarkers[id];
      }
    });

    Object.values(players).forEach((p) => {
      const isMe = p.u === userId;
      const markerClass = isMe ? 'player-marker-me' : 'player-marker-team';

      if (playerMarkers[p.u]) {
        playerMarkers[p.u].setLatLng([p.lat, p.lng]);
      } else {
        const customIcon = L.divIcon({
          className: markerClass,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        const marker = L.marker([p.lat, p.lng], { icon: customIcon })
          .bindTooltip(isMe ? 'YOU' : p.u, { permanent: true, direction: 'bottom', offset: [0, 8] })
          .addTo(map);

        playerMarkers[p.u] = marker;
      }
    });
  });
</script>

</body>
</html>
