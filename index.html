<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BFT - UAV Tactical Tracker</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; touch-action: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #050b14;
      font-family: 'Courier New', Courier, monospace;
      color: #00ffcc;
    }
    #map {
      height: 100vh; width: 100vw;
      background-color: #050b14;
    }
    
    /* 作戦描画用キャンバス */
    #drawCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 500;
      pointer-events: none;
    }
    #drawCanvas.active {
      pointer-events: auto;
    }

    /* 軍用HUD風ディスプレイ */
    .hud-overlay {
      position: absolute;
      top: 12px; left: 12px; z-index: 1000;
      background: rgba(5, 11, 20, 0.85);
      border: 1px solid #00ffcc;
      border-radius: 4px;
      padding: 10px 14px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.25);
      pointer-events: auto;
    }
    .hud-title {
      font-size: 10px; font-weight: bold; letter-spacing: 1px;
      color: #88ffdd; text-transform: uppercase; margin-bottom: 4px;
    }
    .hud-timer {
      font-size: 16px; font-weight: bold; color: #ffffff;
    }
    .hud-status {
      font-size: 11px; color: #00ffcc; margin-top: 4px;
    }

    /* 右上：全画面表示ボタン */
    .fullscreen-control {
      position: absolute;
      top: 12px; right: 12px; z-index: 1000;
      pointer-events: auto;
    }

    /* 右下：作戦描画用コントロールUI */
    .draw-controls {
      position: absolute;
      bottom: 20px; right: 12px; z-index: 1000;
      display: flex; gap: 8px;
      pointer-events: auto;
    }
    .hud-btn {
      background: rgba(5, 11, 20, 0.9);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 12px; font-weight: bold;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
    }
    .hud-btn.active {
      background: #00ffcc;
      color: #050b14;
    }

    /* マーカーデザイン（発光ドット） */
    .player-marker-me {
      width: 14px; height: 14px;
      background-color: #00ffcc; border: 2px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 12px #00ffcc;
    }
    .player-marker-team {
      width: 12px; height: 12px;
      background-color: #0099ff; border: 2px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 8px #0099ff;
    }
  </style>
</head>
<body>

<div class="hud-overlay">
  <div class="hud-title">UAV RECON // SQUAD-ALPHA</div>
  <div class="hud-timer" id="uavTimer">NEXT SCAN: 60S</div>
  <div class="hud-status" id="statusText">ACQUIRING GPS...</div>
</div>

<!-- 全画面切り替えボタン -->
<div class="fullscreen-control">
  <button id="fullScreenBtn" class="hud-btn">FULLSCREEN</button>
</div>

<!-- 作戦描画ボタン -->
<div class="draw-controls">
  <button id="toggleDrawBtn" class="hud-btn">DRAW: OFF</button>
  <button id="clearDrawBtn" class="hud-btn">CLEAR</button>
</div>

<canvas id="drawCanvas"></canvas>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase SDK (v10 Modular CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getDatabase, ref, set, onValue, onDisconnect 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // ==========================================
  // 1. Firebase 設定
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyBXskTRVUm4CL9rPQj110sw59M20OyJi28",
    authDomain: "spac-gps.firebaseapp.com",
    databaseURL: "https://spac-gps-default-rtdb.firebaseio.com",
    projectId: "spac-gps",
    storageBucket: "spac-gps.firebasestorage.app",
    messagingSenderId: "184349883329",
    appId: "1:184349883329:web:7e1d0bc6b40fa58e2dcd40",
    measurementId: "G-SWCQYHGHYX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const userId = "OPERATOR_" + Math.floor(100 + Math.random() * 900);
  const teamId = "alpha_squad";

  // ==========================================
  // 2. 地図の初期化（最大ズームレベル21）
  // ==========================================
  const map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
    maxZoom: 21
  });

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: 19,
    maxZoom: 21
  }).addTo(map);

  const playerMarkers = {};
  let currentLat = null;
  let currentLng = null;
  let isMapInitialized = false;

  // ==========================================
  // 3. 全画面モード制御（Fullscreen API）
  // ==========================================
  const fullScreenBtn = document.getElementById('fullScreenBtn');

  fullScreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      } else if (document.documentElement.webkitRequestFullscreen) { // Safari (iOS/Mac) 対応
        document.documentElement.webkitRequestFullscreen();
      }
      fullScreenBtn.innerText = "EXIT FULL";
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      fullScreenBtn.innerText = "FULLSCREEN";
    }
  });

  // ==========================================
  // 4. 作戦描画キャンバス（手書き機能）
  // ==========================================
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const toggleDrawBtn = document.getElementById('toggleDrawBtn');
  const clearDrawBtn = document.getElementById('clearDrawBtn');
  let isDrawingMode = false;
  let isPenDown = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    map.invalidateSize(); // リサイズ時に地図描画も自動更新
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  toggleDrawBtn.addEventListener('click', () => {
    isDrawingMode = !isDrawingMode;
    if (isDrawingMode) {
      canvas.classList.add('active');
      toggleDrawBtn.classList.add('active');
      toggleDrawBtn.innerText = "DRAW: ON";
      map.dragging.disable();
    } else {
      canvas.classList.remove('active');
      toggleDrawBtn.classList.remove('active');
      toggleDrawBtn.innerText = "DRAW: OFF";
      map.dragging.enable();
    }
  });

  clearDrawBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  function getTouchPos(e) {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return {
      x: touch.clientX - rect.left,
      y: touch.clientY - rect.top
    };
  }

  function startDrawing(e) {
    if (!isDrawingMode) return;
    isPenDown = true;
    const pos = getTouchPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    ctx.strokeStyle = '#ff0055'; // タクティカルレッド
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
  }

  function draw(e) {
    if (!isPenDown || !isDrawingMode) return;
    const pos = getTouchPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() {
    isPenDown = false;
  }

  canvas.addEventListener('touchstart', startDrawing);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDrawing);
  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);

  // ==========================================
  // 5. UAVスキャン処理（1分間隔 ＆ バイブ通知）
  // ==========================================
  const SCAN_INTERVAL_SEC = 60;
  let countdown = SCAN_INTERVAL_SEC;

  function executeUAVScan() {
    if (currentLat && currentLng) {
      const userRef = ref(db, `teams/${teamId}/players/${userId}`);
      onDisconnect(userRef).remove();

      set(userRef, {
        u: userId,
        lat: currentLat,
        lng: currentLng,
        scannedAt: Date.now()
      });

      if ("vibrate" in navigator) {
        navigator.vibrate([120, 80, 120]);
      }

      const statusText = document.getElementById("statusText");
      statusText.innerText = "UAV SCAN COMPLETE";
      statusText.style.color = "#ffffff";
      setTimeout(() => {
        statusText.style.color = "#00ffcc";
        statusText.innerText = "STANDBY FOR NEXT RECON";
      }, 2500);
    }
  }

  setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      executeUAVScan();
      countdown = SCAN_INTERVAL_SEC;
    }
    document.getElementById("uavTimer").innerText = `NEXT SCAN: ${countdown}S`;
  }, 1000);

  // ==========================================
  // 6. 初回現在地でマップ起動 ＆ GPS保持
  // ==========================================
  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        currentLat = position.coords.latitude;
        currentLng = position.coords.longitude;

        map.setView([currentLat, currentLng], 20);
        isMapInitialized = true;
        executeUAVScan();
      },
      (err) => {
        console.warn("GPS取得失敗:", err);
        map.setView([35.9868, 139.8515], 18);
        isMapInitialized = true;
      },
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
    );

    navigator.geolocation.watchPosition(
      (position) => {
        currentLat = position.coords.latitude;
        currentLng = position.coords.longitude;

        if (!isMapInitialized) {
          map.setView([currentLat, currentLng], 20);
          isMapInitialized = true;
          executeUAVScan();
        }
      },
      (err) => console.error("GPS Error:", err),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 2000 }
    );
  } else {
    alert("GPS非対応の端末です。");
  }

  // ==========================================
  // 7. 味方位置の受信・同期
  // ==========================================
  const teamPlayersRef = ref(db, `teams/${teamId}/players`);
  onValue(teamPlayersRef, (snapshot) => {
    const players = snapshot.val() || {};

    Object.keys(playerMarkers).forEach((id) => {
      if (!players[id]) {
        map.removeLayer(playerMarkers[id]);
        delete playerMarkers[id];
      }
    });

    Object.values(players).forEach((p) => {
      const isMe = p.u === userId;
      const markerClass = isMe ? 'player-marker-me' : 'player-marker-team';

      if (playerMarkers[p.u]) {
        playerMarkers[p.u].setLatLng([p.lat, p.lng]);
      } else {
        const customIcon = L.divIcon({
          className: markerClass,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        const marker = L.marker([p.lat, p.lng], { icon: customIcon })
          .bindTooltip(isMe ? 'YOU' : p.u, { permanent: true, direction: 'bottom', offset: [0, 8] })
          .addTo(map);

        playerMarkers[p.u] = marker;
      }
    });
  });
</script>

</body>
</html>
